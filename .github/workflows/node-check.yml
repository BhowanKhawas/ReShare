name: Node Environment Check

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

# Add this to fix the warning in THIS workflow
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-node:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # This is your app's version, which is fine

      - name: Verify Version
        run: node --version
