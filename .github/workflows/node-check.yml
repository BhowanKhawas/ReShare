name: Node Environment Check

on:
  push:
    branches: [ main ]

jobs:
  check-node:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Version
        run: node --version
