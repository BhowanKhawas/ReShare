name: Security Scan

# Added 'workflow_dispatch' to allow manual triggering from the Actions tab
on: 
  push:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  trivy-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # Pulls your ReShare code

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
